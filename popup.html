<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <img src="images/icon32.png" />
        <h3 class="title">Unhook for Gemini</h3>
      </header>
      <section class="cards">
        <div class="card">
          <label for="message-checkbox">Hide Greeting Message</label>
          <input type="checkbox" name="message" id="message-checkbox" />
        </div>
        <div class="card">
          <label for="new-chat-button-checkbox">Hide New Chat</label>
          <input
            type="checkbox"
            name="newChatButton"
            id="new-chat-button-checkbox"
          />
        </div>
        <div class="card">
          <label for="search-chats-button-checkbox">Hide Search Chats</label>
          <input
            type="checkbox"
            name="searchChatsButton"
            id="search-chats-button-checkbox"
          />
        </div>
        <div class="card">
          <label for="students-checkbox">Hide Students Section</label>
          <input type="checkbox" name="students" id="students-checkbox" />
        </div>
        <div class="card">
          <label for="images-checkbox">Hide Images Section</label>
          <input type="checkbox" name="images" id="images-checkbox" />
        </div>
        <div class="card">
          <label for="library-checkbox">Hide Library Section</label>
          <input type="checkbox" name="library" id="library-checkbox" />
        </div>
        <div class="card">
          <label for="notebooks-checkbox">Hide Notebooks</label>
          <input type="checkbox" name="notebooks" id="notebooks-checkbox" />
        </div>
        <div class="card">
          <label for="recents-checkbox">Hide Recents</label>
          <input type="checkbox" name="recents" id="recents-checkbox" />
        </div>
        <div class="card">
          <label for="upgrade-button-checkbox">Hide Upgrade Button</label>
          <input
            type="checkbox"
            name="upgradeButton"
            id="upgrade-button-checkbox"
          />
        </div>
        <div class="card">
          <label for="temp-chat-button-checkbox">Hide Temporary Chat</label>
          <input
            type="checkbox"
            name="tempChatButton"
            id="temp-chat-button-checkbox"
          />
        </div>
      </section>
      <footer class="footer">
        <div class="icons">
          <a href="https://ko-fi.com/B0B6127DWV" target="_blank"
            ><img
              height="36"
              style="border: 0px; height: 36px"
              src="https://storage.ko-fi.com/cdn/kofi5.png?v=6"
              border="0"
              alt="Buy Me a Coffee at ko-fi.com"
          /></a>
          <a href="https://github.com/TheRavenix" target="_blank">
            <div class="github-icon-mask"></div>
          </a>
        </div>
        <a href="https://docs.google.com/forms" target="_blank"
          >Report a bug or suggest a feature</a
        >
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
